<!doctype html>
<html lang="it">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aggiornamento CQ Spot</title>
<body style="font:16px system-ui;padding:24px;text-align:center">
<p id="message">Pulizia della cache in corso…</p>
<script>
(async()=>{
  try {
    if('serviceWorker' in navigator) await Promise.all((await navigator.serviceWorker.getRegistrations()).map(r=>r.unregister()));
    if('caches' in window) await Promise.all((await caches.keys()).map(k=>caches.delete(k)));
    document.getElementById('message').textContent='Cache pulita. Apertura Mini App…';
  } catch(e) { document.getElementById('message').textContent='Pulizia non completata. Riprova.'; return; }
  setTimeout(()=>location.replace('/'),300);
})();
</script>
</body>
</html>
